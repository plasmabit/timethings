name: Release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - name: Verify the release copy matches the production build output
        run: cmp main.js dist/main.js
      - name: Verify the bundle is reproducible with a clean npm install
        shell: bash
        run: |
          expected="$(sha256sum main.js | cut -d ' ' -f 1)"
          audit_dir="$(mktemp -d)"
          trap 'rm -rf "$audit_dir"' EXIT
          git archive HEAD | tar -x -C "$audit_dir"
          (
            cd "$audit_dir"
            npm install --ignore-scripts --no-audit --no-fund
            npm run build
            actual="$(sha256sum main.js | cut -d ' ' -f 1)"
            test "$actual" = "$expected"
          )
      - name: Attest release assets
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/main.js
            dist/manifest.json
            dist/styles.css
      - name: Create draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release create "$tag" \
            --title "$tag" \
            --draft \
            --verify-tag \
            dist/main.js dist/manifest.json dist/styles.css
